  const linkClasses = ["follow", "message", "ios", "android", "extension"];

  function applyLinks(links) {
    document.querySelectorAll("a.hit").forEach(el => {
      const key = linkClasses.find(name => el.classList.contains(name));
      const raw = links && key && typeof links[key] === "string" ? links[key].trim() : "";

  fetch(linksUrl, { method: "GET", mode: "cors", credentials: "omit" })

      if (!response.ok) throw new Error("Firebase HTTP " + response.status);
